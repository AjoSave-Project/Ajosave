<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/images/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e40af" />
    <meta name="description" content="Digital Community Saving Made Simple, Secure, and Rewarding" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AjoSave" />
    <link rel="apple-touch-icon" href="/src/assets/images/icon.png" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    
    <title>AjoSave - Digital Community Saving</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload critical font weights -->
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.com/s/nunito/v26/XRXI3I6Li01BKofiOc5wtlZ2di8HDLshdTQ3j77e.woff2" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=block" rel="stylesheet" />
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
      /* Prevent FOUT by hiding content until fonts load */
      #root {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }
      #root.fonts-loaded {
        opacity: 1;
      }
      /* Loading screen */
      #font-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1e40af;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #font-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="font-loader">
      <div class="loader-spinner"></div>
    </div>
    <div id="root"></div>
    <script>
      // Font loading detection
      (function() {
        const loader = document.getElementById('font-loader');
        const root = document.getElementById('root');
        const maxWaitTime = 3000; // Maximum 3 seconds wait
        let fontsLoaded = false;

        function hideLoader() {
          if (!fontsLoaded) {
            fontsLoaded = true;
            root.classList.add('fonts-loaded');
            setTimeout(() => {
              loader.classList.add('hidden');
              setTimeout(() => loader.remove(), 300);
            }, 100);
          }
        }

        // Use Font Loading API if available
        if ('fonts' in document) {
          Promise.all([
            document.fonts.load('400 1em Nunito'),
            document.fonts.load('500 1em Nunito'),
            document.fonts.load('600 1em Nunito'),
            document.fonts.load('700 1em Nunito')
          ]).then(hideLoader).catch(hideLoader);
          
          // Fallback timeout
          setTimeout(hideLoader, maxWaitTime);
        } else {
          // Fallback for browsers without Font Loading API
          window.addEventListener('load', hideLoader);
          setTimeout(hideLoader, maxWaitTime);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
