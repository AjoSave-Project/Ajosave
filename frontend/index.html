<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/images/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e40af" />
    <meta name="description" content="Digital Community Saving Made Simple, Secure, and Rewarding" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS PWA Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AjoSave" />
    <link rel="apple-touch-icon" href="/src/assets/images/icon.png" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    
    <title>AjoSave - Digital Community Saving</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Use Google Fonts with display=swap for better performance -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
      /* Prevent FOUT by hiding content until fonts load */
      #root {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }
      #root.fonts-loaded {
        opacity: 1;
      }
      /* Loading screen */
      #font-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1e40af;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #font-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="font-loader">
      <div class="loader-spinner"></div>
    </div>
    <div id="root"></div>
    <script>
      // Simple font loading with fallback
      (function() {
        const loader = document.getElementById('font-loader');
        const root = document.getElementById('root');
        
        function hideLoader() {
          root.classList.add('fonts-loaded');
          setTimeout(() => {
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 300);
          }, 100);
        }

        // Hide loader after a short delay or when page loads
        window.addEventListener('load', hideLoader);
        setTimeout(hideLoader, 1000); // Fallback after 1 second
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
